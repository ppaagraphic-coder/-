<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#56633a">
<title>ควบคุมรับส่งผ้า Meedao</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky tab header, one form at a time as stacked item cards (grid row on wide screens), sticky progress bar at the bottom. */
:root{
  --bg:#f5f5ef; --surface:#ffffff; --fg:#22261c; --muted:#666d5b; --line:#d6d8c7;
  --accent:#56633a; --accent-weak:#e6ebd3; --accent-fg:#ffffff; --bar:#a9ab8d;
  --danger:#a63a2b; --pad:#fbfbf7; --ink:#1c2a5e;
  --f-body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15170f; --surface:#1e2116; --fg:#ecede2; --muted:#9aa08b; --line:#363b2a;
    --accent:#b4c27a; --accent-weak:#2a301d; --accent-fg:#1a1d10; --bar:#6c6e57; --danger:#e58b7b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15170f; --surface:#1e2116; --fg:#ecede2; --muted:#9aa08b; --line:#363b2a;
  --accent:#b4c27a; --accent-weak:#2a301d; --accent-fg:#1a1d10; --bar:#6c6e57; --danger:#e58b7b;
  color-scheme:dark;
}
[hidden]{display:none!important}
:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:940px;margin:0 auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px}
.banner{display:block;width:100%;height:auto;aspect-ratio:2400/157;margin-top:12px;background:#fff;border-radius:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0 10px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;font-weight:600;font-size:16px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

main{padding-bottom:110px}
.dochead h1{font-size:24px;line-height:1.25;margin:10px 0 12px;font-weight:700;text-wrap:balance}

.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;margin-bottom:16px}
.field{min-width:0;display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px;appearance:none;-webkit-appearance:none}
.field input:focus,.note:focus,.fl input:focus,.name-in:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}

/* items */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name sum" "floors floors" "note note";gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.name{grid-area:name;display:flex;gap:8px;align-items:baseline;min-width:0;font-weight:500;font-size:15px;line-height:1.35}
.no{color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.5em;font-weight:400}
.floors{grid-area:floors;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.fl{display:flex;flex-direction:column;gap:2px;min-width:0}
.fl span{font-size:11.5px;color:var(--muted);text-align:center}
.fl input{width:100%;min-width:0;height:46px;text-align:center;font-size:18px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-variant-numeric:tabular-nums;padding:0 2px}
.fl input.has{background:var(--accent-weak);border-color:var(--accent)}
.sum{grid-area:sum;text-align:right;line-height:1.1}
.sum small{display:block;font-size:11.5px;color:var(--muted)}
.sum b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sum b.pos{color:var(--accent)}
.note{grid-area:note;width:100%;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
.name-in{width:100%;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}

.totals{margin-top:12px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:12px}
.totals h2{font-size:16px;margin:0 0 8px;font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center}
.tgrid div{display:flex;flex-direction:column;gap:2px}
.tgrid small{font-size:11.5px;color:var(--muted)}
.tgrid b{font-size:20px;font-variant-numeric:tabular-nums}
.tgrid .all b{color:var(--accent)}

/* signatures */
.sigs{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px;scroll-margin-top:120px}
.sigcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sigcard h3{margin:0;font-size:16px;font-weight:600}
.pad{position:relative;background:var(--pad);border:1px dashed var(--muted);border-radius:10px;overflow:hidden}
.pad canvas{display:block;width:100%;aspect-ratio:5/2;touch-action:none;cursor:crosshair}
.pad .base{position:absolute;left:8%;right:8%;bottom:26%;border-bottom:1px solid #b9baa8;pointer-events:none}
.pad .hint{position:absolute;inset:auto 0 8px;text-align:center;font-size:13px;color:#8a8d7b;pointer-events:none}
.pad .hint.off{display:none}
.sigrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.stamp{font-size:12px;color:var(--muted);min-height:18px}
.btn{min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.armed{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.6;cursor:default}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.actions .btn{flex:1 1 200px}
.copybox{width:100%;margin-top:10px;min-height:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.foot{margin:14px 0 0;color:var(--muted);font-size:12.5px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px, env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px))}
.bar .in{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.bar .stat{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.bar .stat b{font-size:16px;font-variant-numeric:tabular-nums}
.bar .stat span{font-size:12.5px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw;text-align:center}

@media (min-width:640px){
  .meta{grid-template-columns:repeat(3,1fr)}
  .field.full{grid-column:span 1}
  .sigs{grid-template-columns:1fr 1fr}
}
@media (min-width:820px){
  .item{grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 62px minmax(0,1fr);grid-template-areas:"name floors sum note"}
}
</style>
</head>
<body>
<div class="wrap">
  <img class="banner" id="banner" alt="inchantree meedao Kanchanaburi">
  <header class="top">
    <div class="tabs" role="tablist" aria-label="เลือกแบบฟอร์ม">
      <button class="tab" role="tab" id="tab-receive" data-tab="receive">รับผ้า</button>
      <button class="tab" role="tab" id="tab-send" data-tab="send">ส่งผ้า</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="bar">
  <div class="in">
    <div class="stat">
      <b id="barMain">0 ชิ้น</b>
      <span>รวมทั้งหมดในแบบฟอร์มนี้</span>
    </div>
    <button class="btn primary" id="toSign" type="button">ไปเซ็นชื่อ ↓</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

function today(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function blankSig(){return {img:null,name:'',time:null};}
function blankForm(){
  return {
    header:{prep:'',docno:'',date:today(),company:'',sendDate:'',recvDate:''},
    items:ITEMS.map(function(){return {q:['','','','',''],note:''};}),
    sigs:{a:blankSig(),b:blankSig()}
  };
}
var state={tab:'receive',receive:blankForm(),send:blankForm()};

function load(){
  try{
    var j=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!j) return;
    ['receive','send'].forEach(function(k){
      var f=j[k]; if(!f||!Array.isArray(f.items)||f.items.length!==ITEMS.length) return;
      var b=blankForm();
      state[k]={
        header:Object.assign(b.header,f.header||{}),
        items:f.items.map(function(it){return {q:(it.q||[]).concat(['','','','','']).slice(0,FLOORS).map(String),note:it.note||''};}),
        sigs:{a:Object.assign(blankSig(),(f.sigs||{}).a||{}),b:Object.assign(blankSig(),(f.sigs||{}).b||{})}
      };
    });
  }catch(e){}
}
var saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify({receive:state.receive,send:state.send}));}catch(e){}
  },250);
}

function h(tag,props){
  var n=document.createElement(tag), kids=Array.prototype.slice.call(arguments,2);
  Object.keys(props||{}).forEach(function(k){
    var v=props[k];
    if(k==='class') n.className=v;
    else if(k==='text') n.textContent=v;
    else if(k.indexOf('on')===0) n.addEventListener(k.slice(2),v);
    else if(v===true) n.setAttribute(k,'');
    else if(v!==false&&v!=null) n.setAttribute(k,v);
  });
  kids.forEach(function(c){ if(c!=null) n.append(c); });
  return n;
}
function num(s){var n=parseInt(s,10);return isNaN(n)?0:n;}
function fmtStamp(iso){
  try{return new Date(iso).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});}catch(e){return '';}
}

var toastT=null;
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;},2400);
}

/* ---------- signature pad ---------- */
function makeSig(canvas,hint,data,onChange){
  var ctx=canvas.getContext('2d'), w=0, hh=0, drawing=false, last=null, lastMid=null, img=null;
  function style(){ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1c2a5e';}
  function paintImg(){ if(img&&img.complete&&w){ctx.clearRect(0,0,w,hh);ctx.drawImage(img,0,0,w,hh);} }
  function fit(){
    var r=canvas.getBoundingClientRect();
    if(!r.width) return;
    var nw=Math.round(r.width), nh=Math.round(r.height);
    if(nw===w&&nh===hh) return;
    w=nw; hh=nh;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(hh*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); style(); paintImg();
  }
  function pos(e){var r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  canvas.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault(); fit();
    try{canvas.setPointerCapture(e.pointerId);}catch(x){}
    drawing=true; last=pos(e); lastMid=last; hint.classList.add('off');
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(last.x+0.01,last.y); ctx.stroke();
  });
  canvas.addEventListener('pointermove',function(e){
    if(!drawing) return; e.preventDefault();
    var p=pos(e), mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};
    ctx.beginPath(); ctx.moveTo(lastMid.x,lastMid.y); ctx.quadraticCurveTo(last.x,last.y,mid.x,mid.y); ctx.stroke();
    last=p; lastMid=mid;
  });
  function end(){
    if(!drawing) return; drawing=false;
    var url=canvas.toDataURL('image/png');
    img=new Image(); img.src=url;
    onChange(url);
  }
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
  if(window.ResizeObserver) new ResizeObserver(fit).observe(canvas); else window.addEventListener('resize',fit);
  if(data){
    img=new Image(); img.onload=function(){fit();paintImg();}; img.src=data; hint.classList.add('off');
  }
  return {
    clear:function(){ if(w) ctx.clearRect(0,0,w,hh); img=null; hint.classList.remove('off'); onChange(null); }
  };
}

/* ---------- form ---------- */
var views={};
var main=document.getElementById('main');

function buildForm(kind){
  var cfg=CFG[kind], S=state[kind];
  var root=h('section',{class:'form',id:'form-'+kind,role:'tabpanel','aria-labelledby':'tab-'+kind});
  root.hidden=state.tab!==kind;

  function field(key,label,type,full){
    var id=kind+'-'+key;
    var inp=h('input',{id:id,type:type,autocomplete:'off',enterkeyhint:'next'});
    inp.value=S.header[key]||'';
    inp.addEventListener('input',function(){S.header[key]=inp.value;save();});
    return h('div',{class:'field'+(full?' full':'')},h('label',{for:id,text:label}),inp);
  }
  root.append(
    h('div',{class:'dochead'},h('h1',{text:cfg.title})),
    h('div',{class:'meta'},
      field('prep','ผู้จัดเตรียม','text'),
      field('docno','เลขที่เอกสาร','text'),
      field('date','วันที่','date'),
      field('company','บริษัทรับซัก','text',true),
      field('sendDate','วันที่ส่งผ้า','date'),
      field('recvDate','วันที่รับผ้า','date')
    )
  );

  var list=h('div',{class:'items'});
  var rows=[];
  ITEMS.forEach(function(name,i){
    var it=S.items[i];
    var sumB=h('b',{text:'0'});
    var card=h('article',{class:'item'});
    var inputs=[];
    var fl=h('div',{class:'floors'});
    for(var f=0;f<FLOORS;f++){(function(f){
      var inp=h('input',{type:'text',inputmode:'numeric',pattern:'[0-9]*',maxlength:4,placeholder:'0',autocomplete:'off','aria-label':name+' ชั้น '+(f+1)});
      inp.value=it.q[f];
      inp.addEventListener('focus',function(){setTimeout(function(){try{inp.select();}catch(e){}},0);});
      inp.addEventListener('input',function(){
        var v=inp.value.replace(/\D/g,'').slice(0,4);
        if(v!==inp.value) inp.value=v;
        it.q[f]=v; save(); update();
      });
      inputs.push(inp);
      fl.append(h('label',{class:'fl'},h('span',{text:'ชั้น '+(f+1)}),inp));
    })(f);}
    var note=h('input',{class:'note',type:'text',placeholder:'หมายเหตุ','aria-label':'หมายเหตุ ข้อ '+(i+1),autocomplete:'off'});
    note.value=it.note;
    note.addEventListener('input',function(){it.note=note.value;save();});
    card.append(
      h('div',{class:'name'},h('span',{class:'no',text:String(i+1)}),h('span',{text:name})),
      fl,
      h('div',{class:'sum'},h('small',{text:'รวม'}),sumB),
      note
    );
    list.append(card);
    rows.push({card:card,sumB:sumB,inputs:inputs});
  });
  root.append(list);

  var tvals=[], tgrid=h('div',{class:'tgrid'});
  for(var f=0;f<FLOORS;f++){var b=h('b',{text:'0'});tvals.push(b);tgrid.append(h('div',{},h('small',{text:'ชั้น '+(f+1)}),b));}
  var allB=h('b',{text:'0'}); tgrid.append(h('div',{class:'all'},h('small',{text:'รวม'}),allB));
  root.append(h('div',{class:'totals'},h('h2',{text:cfg.total}),tgrid));

  /* signatures */
  var sigWrap=h('div',{class:'sigs',id:'sigs-'+kind});
  var pads={};
  cfg.sigs.forEach(function(pair){
    var key=pair[0], label=pair[1], sg=S.sigs[key];
    var canvas=h('canvas',{'aria-label':'ช่องเซ็นชื่อ '+label});
    var hint=h('div',{class:'hint',text:'เซ็นชื่อด้วยนิ้วที่นี่'});
    var stamp=h('div',{class:'stamp',text:sg.time?'เซ็นเมื่อ '+fmtStamp(sg.time):''});
    var nm=h('input',{class:'name-in',type:'text',placeholder:'ชื่อ-นามสกุล',autocomplete:'off','aria-label':'ชื่อ'+label});
    nm.value=sg.name||'';
    nm.addEventListener('input',function(){sg.name=nm.value;save();});
    var pad;
    var clr=h('button',{class:'btn',type:'button',text:'ล้าง',onclick:function(){pad.clear();}});
    pad=makeSig(canvas,hint,sg.img,function(url){
      sg.img=url; sg.time=url?new Date().toISOString():null;
      stamp.textContent=sg.time?'เซ็นเมื่อ '+fmtStamp(sg.time):'';
      save();
    });
    pads[key]=pad;
    sigWrap.append(h('div',{class:'sigcard'},
      h('h3',{text:label}),
      h('div',{class:'pad'},canvas,h('div',{class:'base'}),hint),
      h('div',{class:'sigrow'},nm,clr),
      stamp
    ));
  });
  root.append(sigWrap);

  /* actions */
  var ta=h('textarea',{class:'copybox','aria-label':'ข้อความสรุป',readonly:true});
  ta.hidden=true;
  var copyBtn=h('button',{class:'btn',type:'button',text:'คัดลอกสรุป (ส่งต่อทางไลน์)',onclick:function(){
    var text=summary(kind);
    var p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(text):Promise.reject();
    p.then(function(){toast('คัดลอกสรุปแล้ว');}).catch(function(){
      ta.hidden=false; ta.value=text; ta.focus(); ta.select(); toast('เลือกข้อความแล้ว กดคัดลอกได้เลย');
    });
  }});
  var pngBtn=h('button',{class:'btn primary',type:'button',text:'บันทึกเป็นรูปภาพ (PNG)',onclick:function(){exportDoc(kind,'png',pngBtn);}});
  var pdfBtn=h('button',{class:'btn primary',type:'button',text:'บันทึกเป็น PDF',onclick:function(){exportDoc(kind,'pdf',pdfBtn);}});
  var shareBtn=h('button',{class:'btn primary',type:'button',text:'แชร์ PDF (ไลน์ อีเมล ฯลฯ)',onclick:function(){exportDoc(kind,'share',shareBtn);}});
  shareBtn.hidden=true;
  try{
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'a.pdf',{type:'application/pdf'})]})) shareBtn.hidden=false;
  }catch(e){}
  var armed=false, armT=null;
  var rst=h('button',{class:'btn',type:'button',text:'ล้างแบบฟอร์มนี้'});
  function disarm(){armed=false;rst.classList.remove('armed');rst.textContent='ล้างแบบฟอร์มนี้';}
  rst.addEventListener('click',function(){
    if(!armed){armed=true;rst.classList.add('armed');rst.textContent='แตะอีกครั้งเพื่อล้างข้อมูลทั้งหมด';armT=setTimeout(disarm,4000);return;}
    clearTimeout(armT); disarm();
    state[kind]=blankForm(); save(); mount(kind); toast('ล้างแบบฟอร์มแล้ว');
  });
  root.append(
    h('div',{class:'actions'},pngBtn,pdfBtn,shareBtn,copyBtn,rst),ta,
    h('p',{class:'foot',text:'ข้อมูลบันทึกอัตโนมัติในเครื่องและเบราว์เซอร์นี้ ไม่ส่งไปที่อื่น'})
  );

  function update(){
    var perFloor=[0,0,0,0,0], all=0;
    rows.forEach(function(r,i){
      var it=S.items[i], t=0;
      it.q.forEach(function(v,f){var n=num(v);perFloor[f]+=n;t+=n;r.inputs[f].classList.toggle('has',n>0);});
      r.sumB.textContent=String(t); r.sumB.classList.toggle('pos',t>0);
      all+=t;
    });
    perFloor.forEach(function(n,f){tvals[f].textContent=String(n);});
    allB.textContent=String(all);
    views[kind].stats={all:all};
    if(state.tab===kind) updateBar();
  }
  views[kind]={root:root,update:update,stats:{all:0},sigId:'sigs-'+kind};
  setTimeout(update,0);
  return root;
}

/* ---------- export (PNG / PDF) ---------- */
function mimeOf(name){return /\.pdf$/i.test(name)?'application/pdf':/\.png$/i.test(name)?'image/png':'application/octet-stream';}
var dlP=Promise.resolve({
  save:function(o){
    return new Promise(function(res,rej){
      try{
        var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:mimeOf(o.filename)});
        var url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url; a.download=o.filename; a.rel='noopener';
        document.body.appendChild(a); a.click();
        setTimeout(function(){a.remove();URL.revokeObjectURL(url);},4000);
        res({status:'saved'});
      }catch(e){rej({code:'unavailable'});}
    });
  }
});
function getDownloads(){return dlP;}
function thDate(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  if(!m) return iso||'';
  return m[3]+'/'+m[2]+'/'+(parseInt(m[1],10)+543);
}
function blobBytes(blob){
  if(blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsArrayBuffer(blob);});
}
function toBlob(cv,type,q){
  return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('blob'));},type,q);});
}
function makePdf(jpeg,imgW,imgH){
  var enc=new TextEncoder(), parts=[], offs=[], len=0;
  function push(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;}
  function obj(n,body){offs[n]=len;push(n+' 0 obj\n');push(body);push('\nendobj\n');}
  push('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
  offs[4]=len;
  push('4 0 obj\n<</Type/XObject/Subtype/Image/Width '+imgW+'/Height '+imgH+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpeg.length+'>>\nstream\n');
  push(jpeg); push('\nendstream\nendobj\n');
  var content='q 842 0 0 595 0 0 cm /Im0 Do Q';
  obj(5,'<</Length '+content.length+'>>\nstream\n'+content+'\nendstream');
  var xr=len, s='xref\n0 6\n0000000000 65535 f \n';
  for(var n=1;n<=5;n++) s+=String(offs[n]).padStart(10,'0')+' 00000 n \n';
  s+='trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF';
  push(s);
  var out=new Uint8Array(len), p=0;
  parts.forEach(function(b){out.set(b,p);p+=b.length;});
  return out;
}
function renderDoc(kind){
  var cfg=CFG[kind], S=state[kind], H=S.header;
  var SC=3, W=842, HT=595;
  var fam='"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif';
  var fontsReady=new Promise(function(res){
    var t=setTimeout(res,2500);
    try{
      Promise.all(['400','500','600','700'].map(function(w){
        return document.fonts.load(w+' 12px "IBM Plex Sans Thai"','กขค abc 123');
      })).then(function(){clearTimeout(t);res();},function(){clearTimeout(t);res();});
    }catch(e){clearTimeout(t);res();}
  });
  var loads=cfg.sigs.map(function(p){
    var d=S.sigs[p[0]].img;
    return new Promise(function(res){
      if(!d) return res(null);
      var im=new Image(); im.onload=function(){res(im);}; im.onerror=function(){res(null);}; im.src=d;
    });
  });
  var bannerP=new Promise(function(res){var bi=new Image();bi.onload=function(){res(bi);};bi.onerror=function(){res(null);};bi.src=BANNER;});
  return Promise.all([fontsReady,Promise.all(loads),bannerP]).then(function(r){
    var sigImgs=r[1], banner=r[2];
    var cv=document.createElement('canvas'); cv.width=W*SC; cv.height=HT*SC;
    var c=cv.getContext('2d'); c.scale(SC,SC);
    c.fillStyle='#ffffff'; c.fillRect(0,0,W,HT);
    var INK='#1a1a1a', MUTE='#5a5a5a';
    function font(w,s){c.font=w+' '+s+'px '+fam;}
    function fit(t,maxW,s,w){
      font(w,s);
      while(c.measureText(t).width>maxW&&s>5.5){s-=0.5;font(w,s);}
      if(c.measureText(t).width>maxW){
        while(t.length>1&&c.measureText(t+'…').width>maxW) t=t.slice(0,-1);
        t=t+'…';
      }
      return t;
    }
    function tx(t,x,y,o){
      o=o||{}; var w=o.w||400, s=o.s||9; t=String(t);
      if(o.max) t=fit(t,o.max,s,w); else font(w,s);
      c.fillStyle=o.c||INK; c.textAlign=o.a||'left'; c.textBaseline='alphabetic';
      c.fillText(t,x,y);
    }
    function ln(x1,y1,x2,y2,lw){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineWidth=lw;c.strokeStyle=INK;c.stroke();}

    /* header banner */
    if(banner) c.drawImage(banner,28,14,786,786*banner.naturalHeight/banner.naturalWidth);
    tx(cfg.title,W/2,92,{s:11,w:700,a:'center'});

    /* meta fields */
    var LF=[['ผู้จัดเตรียม',H.prep],['วันที่',thDate(H.date)],['บริษัทรับซัก',H.company]];
    var RF=[['เลขที่เอกสาร',H.docno],['วันที่ส่งผ้า',thDate(H.sendDate)],['วันที่รับผ้า',thDate(H.recvDate)]];
    LF.forEach(function(p,i){
      var y=112+i*15; tx(p[0],28,y,{s:8}); ln(98,y+3,300,y+3,0.6);
      if(p[1]) tx(p[1],102,y,{s:9,max:194});
    });
    RF.forEach(function(p,i){
      var y=112+i*15; tx(p[0],560,y,{s:8}); ln(636,y+3,814,y+3,0.6);
      if(p[1]) tx(p[1],640,y,{s:9,max:170});
    });

    /* table */
    var TY=152, HB=TY+28, RH=17, BODY=HB+ITEMS.length*RH, BOT=BODY+RH;
    var X0=28, X1=62, X2=292, FW=30, X3=X2+FW*FLOORS, X4=X3+38, X5=814;
    c.lineWidth=1.4; c.strokeStyle=INK; c.strokeRect(X0,TY,X5-X0,BOT-TY);
    ln(X0,HB,X5,HB,1);
    ln(X2,TY+14,X4,TY+14,0.6);
    ln(X1,TY,X1,BOT,0.8); ln(X2,TY,X2,BOT,0.8); ln(X4,TY,X4,BOT,0.8);
    for(var f=1;f<=FLOORS;f++) ln(X2+FW*f,TY+14,X2+FW*f,BOT,0.5);
    tx('ลำดับ',(X0+X1)/2,TY+18,{s:8,w:700,a:'center'});
    tx('รายการผ้า',(X1+X2)/2,TY+18,{s:8,w:700,a:'center'});
    tx('จำนวนผ้า / ชั้น',(X2+X4)/2,TY+10.5,{s:8,w:700,a:'center'});
    for(var g=0;g<FLOORS;g++) tx('ชั้น '+(g+1),X2+FW*g+FW/2,TY+24.5,{s:7.5,w:700,a:'center'});
    tx('รวม',X3+19,TY+24.5,{s:7.5,w:700,a:'center'});
    tx('หมายเหตุ',(X4+X5)/2,TY+18,{s:8,w:700,a:'center'});

    var perFloor=[0,0,0,0,0], all=0;
    ITEMS.forEach(function(name,i){
      var it=S.items[i], ry=HB+i*RH, by=ry+11.5, t=0;
      if(i>0) ln(X0,ry,X5,ry,0.4);
      tx(String(i+1),38,by,{s:8.5,c:MUTE,a:'center'});
      tx(name,66,by,{s:9,max:222});
      it.q.forEach(function(v,f){
        var n=num(v); perFloor[f]+=n; t+=n;
        if(n>0) tx(String(n),X2+FW*f+FW/2,by,{s:9.5,w:500,a:'center'});
      });
      all+=t;
      if(t>0) tx(String(t),X3+19,by,{s:9.5,w:700,a:'center'});
      if(it.note) tx(it.note,X4+4,by,{s:8.5,max:X5-X4-8});
    });
    ln(X0,BODY,X5,BODY,1);
    tx(cfg.total,(X0+X2)/2,BODY+11.5,{s:8.5,w:700,a:'center'});
    perFloor.forEach(function(n,f){ if(n>0) tx(String(n),X2+FW*f+FW/2,BODY+11.5,{s:9.5,w:700,a:'center'}); });
    if(all>0) tx(String(all),X3+19,BODY+11.5,{s:9.5,w:700,a:'center'});

    /* signatures */
    var SY=562, spec=[{lx:28,x1:60,x2:290},{lx:560,x1:592,x2:814}];
    cfg.sigs.forEach(function(p,i){
      var sg=S.sigs[p[0]], sp=spec[i], mid=(sp.x1+sp.x2)/2;
      tx(p[1],sp.lx,SY,{s:9,w:700});
      ln(sp.x1,SY+2,sp.x2,SY+2,0.6);
      if(sigImgs[i]) c.drawImage(sigImgs[i],mid-45,SY-39,90,36);
      if(sg.name) tx(sg.name,mid,SY+13,{s:8,a:'center',max:sp.x2-sp.x1});
      if(sg.img&&sg.time) tx('เซ็นเมื่อ '+fmtStamp(sg.time),mid,SY+22,{s:6.5,c:MUTE,a:'center'});
    });
    return cv;
  });
}
function exportDoc(kind,fmt,btn){
  var label=btn.textContent;
  getDownloads().then(function(d){
    if(!d) throw {code:'unavailable'};
    btn.disabled=true; btn.textContent='กำลังสร้างไฟล์...';
    return renderDoc(kind).then(function(cv){
      var base='meedao-'+(kind==='receive'?'receive':'send')+'-'+((state[kind].header.date||today()).replace(/-/g,''));
      if(fmt==='png') return toBlob(cv,'image/png').then(function(b){return d.save({filename:base+'.png',data:b});});
      return toBlob(cv,'image/jpeg',0.92).then(blobBytes).then(function(buf){
        var pdf=makePdf(new Uint8Array(buf),cv.width,cv.height);
        if(fmt==='share'){
          var file=new File([pdf],base+'.pdf',{type:'application/pdf'});
          return navigator.share({files:[file],title:base}).then(function(){return {status:'shared'};});
        }
        return d.save({filename:base+'.pdf',data:pdf});
      });
    });
  }).then(function(r){
    if(r&&r.status==='saved') toast('บันทึกไฟล์แล้ว');
  }).catch(function(e){
    if(e&&(e.code==='declined'||e.name==='AbortError')) return;
    toast('บันทึกไฟล์ไม่สำเร็จ ลองอีกครั้ง');
  }).then(function(){btn.disabled=false;btn.textContent=label;});
}

function summary(kind){
  var cfg=CFG[kind], S=state[kind], H=S.header, L=[];
  L.push(cfg.title+' — inchantree meedao');
  if(H.docno) L.push('เลขที่เอกสาร: '+H.docno);
  if(H.date) L.push('วันที่: '+H.date);
  if(H.prep) L.push('ผู้จัดเตรียม: '+H.prep);
  if(H.company) L.push('บริษัทรับซัก: '+H.company);
  if(H.sendDate) L.push('วันที่ส่งผ้า: '+H.sendDate);
  if(H.recvDate) L.push('วันที่รับผ้า: '+H.recvDate);
  L.push('');
  var all=0;
  ITEMS.forEach(function(name,i){
    var it=S.items[i], t=0, parts=[];
    it.q.forEach(function(v,f){var n=num(v);t+=n;if(n>0)parts.push('ชั้น '+(f+1)+'='+n);});
    if(t>0||it.note){
      L.push((i+1)+'. '+name+(t>0?' : '+parts.join(', ')+' (รวม '+t+')':'')+(it.note?' [หมายเหตุ: '+it.note+']':''));
    }
    all+=t;
  });
  L.push('');
  L.push(cfg.total+': '+all+' ชิ้น');
  cfg.sigs.forEach(function(p){
    var sg=S.sigs[p[0]];
    L.push(p[1]+': '+(sg.name||'-')+(sg.img?' (เซ็นแล้ว '+fmtStamp(sg.time)+')':' (ยังไม่เซ็น)'));
  });
  return L.join('\n');
}

function mount(kind){
  var old=views[kind]&&views[kind].root;
  var n=buildForm(kind);
  if(old) old.replaceWith(n); else main.append(n);
}

function updateBar(){
  var s=views[state.tab].stats;
  document.getElementById('barMain').textContent=s.all+' ชิ้น';
}

function setTab(tab,fromHash){
  if(!CFG[tab]) tab='receive';
  state.tab=tab;
  Object.keys(CFG).forEach(function(k){
    views[k].root.hidden=k!==tab;
    var b=document.getElementById('tab-'+k);
    b.setAttribute('aria-selected',String(k===tab));
    b.tabIndex=k===tab?0:-1;
  });
  updateBar();
  if(!fromHash){
    try{history.replaceState(null,'','#'+tab);}catch(e){}
    window.scrollTo(0,0);
  }
}

load();
mount('receive'); mount('send');
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){setTab(b.getAttribute('data-tab'));});
});
document.getElementById('toSign').addEventListener('click',function(){
  var el=document.getElementById(views[state.tab].sigId);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
});
window.addEventListener('hashchange',function(){
  var t=location.hash.replace('#','');
  if(CFG[t]&&t!==state.tab) setTab(t,true);
});
var t0=location.hash.replace('#','');
setTab(CFG[t0]?t0:'receive',true);
})();
</script>
