<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใบส่งมอบงาน / ตรวจรับงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceeea;--card:#fff;--tx:#1c2321;--mut:#5d6965;--bd:#cfd6d2;--ac:#0f6b5c;--on:#fff;--in:#f7f8f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1d2321;--tx:#e8ede9;--mut:#9aa8a2;--bd:#34403b;--ac:#3fb89f;--on:#06201a;--in:#161c1a}}
:root[data-theme="dark"]{--bg:#141816;--card:#1d2321;--tx:#e8ede9;--mut:#9aa8a2;--bd:#34403b;--ac:#3fb89f;--on:#06201a;--in:#161c1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Noto Sans Thai',sans-serif}
.app{display:grid;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media(min-width:980px){.app{grid-template-columns:400px 1fr;align-items:start}.panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px}
h1{font-size:20px;margin:0 0 12px}
fieldset{border:0;border-top:1px solid var(--bd);margin:14px 0 0;padding:12px 0 0}
legend{font-weight:700;padding-right:8px;color:var(--ac)}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 2px}
input[type=text],input[type=datetime-local],textarea{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
textarea{resize:vertical}
.r{display:flex;gap:8px}.r>*{flex:1}
.opts label{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:16px;margin:4px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700;width:100%;padding:12px;margin-top:16px}
.sg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sg img{height:44px;background:#fff;border:1px solid var(--bd);border-radius:4px;display:none}
input[type=range]{width:100%}
.stage{overflow:hidden}
#frame{position:relative}
#paper{width:794px;height:1123px;background:#fff;color:#000;font-family:'Noto Sans Thai',sans-serif;font-size:16px;line-height:1.45;padding:40px 64px;transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 1px 8px rgba(0,0,0,.25)}
#paper .hd{display:block;width:100%;margin:0 0 14px}
.dbox{border:1px solid #000;padding:8px}
#p_photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
#p_photos:empty{display:none}
#p_photos img{width:100%;height:auto;display:block;border:1px solid #999}
#paper h2{text-align:center;font-size:28px;margin:0 0 14px;font-weight:700}
#paper .sub{text-align:center;color:#444;margin-bottom:22px}
.row{display:flex;justify-content:space-between;gap:24px;margin-bottom:10px;font-size:18px}
.row .f{font-size:16px}
.f{border-bottom:1px dotted #000;min-height:28px;padding:0 4px;white-space:pre-wrap}
.lb{font-weight:600;font-size:18px;margin-top:12px}
.cb{display:inline-block;width:16px;height:16px;border:1.5px solid #000;vertical-align:-2px;margin-right:6px;position:relative}
.cb.on::after{content:"";position:absolute;left:4px;top:-1px;width:5px;height:10px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.res{display:flex;gap:22px;margin-top:6px}
.sigs{position:absolute;left:64px;right:64px;bottom:64px;display:flex;gap:40px}
.sig{flex:1;text-align:center;font-size:16px}
.sig .box{height:84px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #000}
.sig .box img{max-width:100%;max-height:80px}
.sig small{display:block;color:#444;font-size:14px}
.ov{display:none;margin-top:12px}
.ov.on{display:block}
.dlg{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:12px}
#cv{width:100%;height:240px;background:#fff;border:1px solid var(--bd);border-radius:6px;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sig .box{cursor:pointer}
#out{max-width:100%;border:1px solid var(--bd)}
.gap{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
<section class="panel">
<h1>ใบส่งมอบงาน / ตรวจรับงาน</h1>
<label for="docNo">เลขที่เอกสาร</label><input type="text" id="docNo" value="DL-2569-001">
<label for="date">วันที่-เวลา</label><input type="datetime-local" id="date">
<div class="r"><div><label for="project">แผนก</label><input type="text" id="project"></div><div><label for="place">สถานที่</label><input type="text" id="place"></div></div>
<label for="detail">รายการงานที่ส่งมอบ</label><textarea id="detail" rows="4"></textarea>
<label>รูปถ่ายประกอบ (สูงสุด 8 รูป)</label>
<label class="btn" style="display:inline-block;margin:0;color:var(--tx)">ถ่ายรูป/เลือกรูป<input type="file" accept="image/*" multiple id="photoIn" hidden></label>
<div id="phList" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"></div>
<fieldset class="opts"><legend>ผลการตรวจรับ</legend>
<label><input type="radio" name="res" value="0" checked> ผ่าน</label>
<label><input type="radio" name="res" value="1"> ผ่านโดยมีเงื่อนไข</label>
<label><input type="radio" name="res" value="2"> ไม่ผ่าน</label>
</fieldset>
<label for="note">หมายเหตุ</label><textarea id="note" rows="2"></textarea>

<fieldset><legend>ผู้ส่งมอบ</legend>
<div class="r"><div><label for="nameA">ชื่อ-สกุล</label><input type="text" id="nameA"></div><div><label for="roleA">ตำแหน่ง</label><input type="text" id="roleA" value="ผู้ส่งมอบงาน"></div></div>
<div class="sg"><button data-pad="A">เซ็นบนจอ</button><label class="btn" style="margin:0;color:var(--tx)">ถ่าย/เลือกรูปลายเซ็น<input type="file" accept="image/*" data-file="A" hidden></label><button data-clr="A">ลบ</button><img id="thA" alt="ลายเซ็นผู้ส่งมอบ"></div>
</fieldset>
<fieldset><legend>ผู้ตรวจรับ</legend>
<div class="r"><div><label for="nameB">ชื่อ-สกุล</label><input type="text" id="nameB"></div><div><label for="roleB">ตำแหน่ง</label><input type="text" id="roleB" value="ผู้ตรวจรับงาน"></div></div>
<div class="sg"><button data-pad="B">เซ็นบนจอ</button><label class="btn" style="margin:0;color:var(--tx)">ถ่าย/เลือกรูปลายเซ็น<input type="file" accept="image/*" data-file="B" hidden></label><button data-clr="B">ลบ</button><img id="thB" alt="ลายเซ็นผู้ตรวจรับ"></div>
</fieldset>
<label for="thr">ความเข้มในการลบพื้นหลังรูปลายเซ็น (ปรับถ้ายังเหลือเงา)</label>
<input type="range" id="thr" min="90" max="235" value="175">
<button class="p" id="exp">สร้างรูปภาพ</button>
<button id="reset" style="width:100%;margin-top:8px">เริ่มเอกสารใหม่ (ล้างข้อมูลทั้งหมด)</button>
</section>

<section class="stage" id="stage"><div id="frame"><div id="paper">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=d=>d.toLocaleString('th-TH',{dateStyle:'long',timeStyle:'short'})+' น.';
const S={A:{img:null,orig:null,t:null},B:{img:null,orig:null,t:null}};

// ค่าเริ่มต้นวันที่
const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
$('#date').value=now.toISOString().slice(0,16);

function render(){setTimeout(save,0);
  ['docNo','project','place','detail','note','nameA','roleA','nameB','roleB'].forEach(k=>$('#p_'+k).textContent=$('#'+k).value);
  const v=$('#date').value; $('#p_date').textContent=v?fmt(new Date(v)):'';
  const r=+($('input[name=res]:checked').value);
  [0,1,2].forEach(i=>$('#c'+i).classList.toggle('on',i===r));
  ['A','B'].forEach(k=>{
    const b=$('#b'+k); b.innerHTML='';
    if(S[k].img){const im=new Image();im.src=S[k].img;b.append(im)}
    $('#p_t'+k).textContent=S[k].t?fmt(S[k].t):'วันที่ ........................';
    const th=$('#th'+k); th.style.display=S[k].img?'block':'none'; if(S[k].img)th.src=S[k].img;
  });
}
$$('input,textarea').forEach(e=>e.addEventListener('input',render));

// ปรับขนาดกระดาษให้พอดีจอ
function fit(){
  const w=$('#stage').clientWidth, s=Math.min(1,w/794);
  $('#paper').style.transform=`scale(${s})`;
  $('#frame').style.width=794*s+'px'; $('#frame').style.height=1123*s+'px';
}
addEventListener('resize',fit);

// ตัดขอบว่างรอบลายเซ็น
function trim(c){
  const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++)if(d[(y*w+i)*4+3]>20){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<x0)return null;
  const p=8,o=document.createElement('canvas');
  o.width=x1-x0+1+p*2;o.height=y1-y0+1+p*2;
  o.getContext('2d').drawImage(c,x0,y0,x1-x0+1,y1-y0+1,p,p,x1-x0+1,y1-y0+1);
  return o.toDataURL('image/png');
}
// ลบพื้นหลังสว่างจากรูปถ่าย
function clean(img,thr){
  const m=Math.min(1,1000/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){
    const l=.299*p[i]+.587*p[i+1]+.114*p[i+2];
    p[i+3]=Math.max(0,Math.min(1,(thr-l)/35))*255;
    p[i]*=.5;p[i+1]*=.5;p[i+2]*=.5; // ทำให้เส้นเข้มขึ้น
  }
  x.putImageData(d,0,0); return trim(c);
}
function reproc(){['A','B'].forEach(k=>{if(S[k].orig){S[k].img=clean(S[k].orig,+$('#thr').value)}});render()}
$('#thr').addEventListener('input',reproc);

$$('[data-file]').forEach(inp=>inp.addEventListener('change',e=>{
  const k=inp.dataset.file,f=e.target.files[0]; if(!f)return;
  const im=new Image(); im.onload=()=>{S[k].orig=im;S[k].img=clean(im,+$('#thr').value);S[k].t=new Date();render();inp.value=''};
  im.src=URL.createObjectURL(f);
}));
$$('[data-clr]').forEach(b=>b.onclick=()=>{const k=b.dataset.clr;S[k]={img:null,orig:null,t:null};render()});

// แผ่นเซ็นบนจอ
let cur=null,drawing=false,last=null,dirty=false;
const cv=$('#cv'),cx=cv.getContext('2d');
function setup(){
  const r=window.devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;
  cx.setTransform(r,0,0,r,0,0);cx.lineWidth=3;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#000';dirty=false;
}
function openPad(k){cur=k;const o=$('#padOv');$('[data-pad='+k+']').closest('fieldset').append(o);o.classList.add('on');requestAnimationFrame(()=>{setup();o.scrollIntoView({block:'center',behavior:'smooth'})})}
function closePad(){$('#padOv').classList.remove('on');document.body.style.overflow=''}
$$('[data-pad]').forEach(b=>b.onclick=()=>openPad(b.dataset.pad));
['A','B'].forEach(k=>{$('#b'+k).onclick=()=>openPad(k)});
const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
['touchstart','touchmove'].forEach(n=>cv.addEventListener(n,e=>e.preventDefault(),{passive:false}));
cv.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);cx.beginPath();cx.arc(last.x,last.y,1.5,0,7);cx.fill();dirty=true});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);cx.beginPath();cx.moveTo(last.x,last.y);cx.lineTo(p.x,p.y);cx.stroke();last=p});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drawing=false));
$('#padClr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);dirty=false};
$('#padX').onclick=closePad;
$('#padOk').onclick=()=>{
  if(!dirty){alert('กรุณาเซ็นในกรอบก่อน แล้วกดใช้ลายเซ็นนี้');return}
  const u=trim(cv); if(!u)return;
  S[cur]={img:u,orig:null,t:new Date()};render();closePad();
};

// Export เป็นรูปภาพ
let blob=null;
$('#exp').onclick=async()=>{
  const btn=$('#exp');btn.textContent='กำลังสร้างรูป...';btn.disabled=true;
  try{
    await document.fonts.ready;
    const c=$('#paper').cloneNode(true);c.style.transform='none';
    const h=document.createElement('div');h.style.cssText='position:fixed;left:-9999px;top:0';h.append(c);document.body.append(h);
    const cvs=await html2canvas(c,{scale:3,backgroundColor:'#fff'});h.remove();
    blob=await new Promise(r=>cvs.toBlob(r,'image/png'));
    $('#out').src=URL.createObjectURL(blob);$('#exp').after($('#outOv'));$('#outOv').classList.add('on');$('#outOv').scrollIntoView({block:'start',behavior:'smooth'});
  }catch(err){alert('สร้างรูปไม่สำเร็จ ลองใหม่อีกครั้ง')}
  btn.textContent='สร้างรูปภาพ';btn.disabled=false;
};
const fname=()=>'ใบส่งมอบงาน_'+($('#docNo').value||'doc')+'.png';
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname();a.click()};
$('#sh').onclick=async()=>{
  const f=new File([blob],fname(),{type:'image/png'});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:fname()}); else alert('เครื่องนี้ไม่รองรับการแชร์ กรุณากดดาวน์โหลด') }catch(e){}
};
$('#outX').onclick=()=>$('#outOv').classList.remove('on');

// รูปถ่ายประกอบ (ครอปเป็น 4:3)
const P=[];
function crop43(img){const W=640,H=480,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);return c.toDataURL('image/jpeg',.85)}
function renderPh(){setTimeout(save,0);
  $('#p_photos').innerHTML=P.map(u=>`<img src="${u}" alt="รูปประกอบ">`).join('');
  $('#phList').innerHTML=P.map((u,i)=>`<span style="position:relative"><img src="${u}" alt="" style="height:48px;border-radius:4px;display:block"><button data-rm="${i}" aria-label="ลบรูป" style="position:absolute;top:-8px;right:-8px;padding:0 7px;border-radius:12px;line-height:20px">×</button></span>`).join('');
}
$('#photoIn').addEventListener('change',async e=>{
  for(const f of [...e.target.files]){
    if(P.length>=8)break;
    await new Promise(res=>{const im=new Image();im.onload=()=>{P.push(crop43(im));URL.revokeObjectURL(im.src);res()};im.onerror=res;im.src=URL.createObjectURL(f)});
  }
  e.target.value='';renderPh();
});
$('#phList').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){P.splice(+b.dataset.rm,1);renderPh()}});
// บันทึกอัตโนมัติ กันข้อมูลหายถ้าหน้าเว็บรีเฟรช
const KEY='deliveryForm.v1',IDS=['docNo','date','project','place','detail','note','nameA','roleA','nameB','roleB'];
function save(){try{const o={f:{},res:$('input[name=res]:checked').value,thr:$('#thr').value,S:{A:{img:S.A.img,t:S.A.t},B:{img:S.B.img,t:S.B.t}},P};IDS.forEach(i=>o.f[i]=$('#'+i).value);localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function restore(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(!o)return;IDS.forEach(i=>{if(o.f[i]!=null)$('#'+i).value=o.f[i]});const r=$('input[name=res][value="'+o.res+'"]');if(r)r.checked=true;$('#thr').value=o.thr;['A','B'].forEach(k=>{S[k].img=o.S[k].img;S[k].t=o.S[k].t?new Date(o.S[k].t):null});P.push(...(o.P||[]))}catch(e){}}
$$('input,textarea').forEach(e=>e.addEventListener('input',()=>setTimeout(save,0)));
let rs=0;$('#reset').onclick=function(){if(!rs){rs=1;this.textContent='กดอีกครั้งเพื่อยืนยันล้างข้อมูล';setTimeout(()=>{rs=0;this.textContent='เริ่มเอกสารใหม่ (ล้างข้อมูลทั้งหมด)'},4000);return}try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
restore();renderPh();render();fit();
</script>
